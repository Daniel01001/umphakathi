<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Umphakathi – Community Hub</title>
  <meta name="description" content="Our community's own space — share news, chat, and support local businesses." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#14563a" />
  <link rel="icon" href="images/favicon-64.png" sizes="64x64" type="image/png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Umphakathi" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=12" />
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#" data-nav="feed"><span class="logo-mark">U</span><span class="logo-text" id="appName">Umphakathi</span></a>
      <div class="topbar-right">
        <span class="mode-pill" id="modePill" hidden>Demo mode</span>
        <button class="install-btn" id="installBtn" hidden>⬇ Install app</button>
        <button class="topbar-icon" id="searchIcon" title="Search"><svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button class="topbar-icon" id="dmIcon" title="Direct messages"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.8 7.3L3.5 20.5l1.7-4.7A8.5 8.5 0 1 1 21 11.5Z"/></svg><span class="dm-badge" id="dmBadge" hidden></span></button>
        <button class="avatar-btn" id="topAvatar" data-nav="profile" title="My profile">?</button>
      </div>
    </div>
  </header>

  <!-- Desktop 3-column shell. On mobile only the center column shows. -->
  <div class="shell" id="shell">

    <!-- LEFT: desktop sidebar navigation -->
    <aside class="leftrail" id="leftRail">
      <nav class="side-nav">
        <button class="side-item active" data-nav="feed"><svg class="icon side-icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg> Feed</button>
        <button class="side-item" data-nav="chat"><svg class="icon side-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.8 7.3L3.5 20.5l1.7-4.7A8.5 8.5 0 1 1 21 11.5Z"/></svg> Community chat</button>
        <button class="side-item" data-nav="market"><svg class="icon side-icon" viewBox="0 0 24 24"><path d="M4 9.5 5.2 5h13.6L20 9.5"/><path d="M4 9.5a2.2 2.2 0 0 0 4 0 2.2 2.2 0 0 0 4 0 2.2 2.2 0 0 0 4 0 2.2 2.2 0 0 0 4 0"/><path d="M5 11v9h14v-9"/><path d="M10 20v-5h4v5"/></svg> Local businesses</button>
        <button class="side-item" data-nav="profile"><svg class="icon side-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg> My profile</button>
      </nav>
      <button class="btn-primary btn-block side-post" data-action="compose"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New post</button>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <!-- CENTER: views render here -->
    <main id="view" class="view"></main>

    <!-- RIGHT: contextual rail (businesses, events) — desktop only -->
    <aside class="rightrail" id="rightRail"></aside>

  </div>

  <!-- Bottom navigation (mobile only) -->
  <nav class="bottomnav" id="bottomNav">
    <button class="nav-item active" data-nav="feed">
      <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span class="nav-label">Feed</span>
    </button>
    <button class="nav-item" data-nav="chat">
      <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.8 7.3L3.5 20.5l1.7-4.7A8.5 8.5 0 1 1 21 11.5Z"/></svg><span class="nav-label">Chat</span>
    </button>
    <button class="nav-item nav-post" data-action="compose" title="New post">
      <span class="nav-post-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button class="nav-item" data-nav="market">
      <svg class="icon nav-icon" viewBox="0 0 24 24"><path d="M4 9.5 5.2 5h13.6L20 9.5"/><path d="M4 9.5a2.2 2.2 0 0 0 4 0 2.2 2.2 0 0 0 4 0 2.2 2.2 0 0 0 4 0 2.2 2.2 0 0 0 4 0"/><path d="M5 11v9h14v-9"/><path d="M10 20v-5h4v5"/></svg><span class="nav-label">Business</span>
    </button>
    <button class="nav-item" data-nav="profile">
      <svg class="icon nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><span class="nav-label">Me</span>
    </button>
  </nav>

  <!-- Modal shell (composer, business form, etc.) -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modalBody" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- Bump ?v= when you change any JS/CSS so phones fetch the new version. -->
  <script src="js/config.js?v=12"></script>
  <script src="js/db.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
  <script>
    // Register the service worker (PWA install + offline). Ignored on file://.
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) =>
          console.warn("Service worker registration failed:", err));
      });
    }
  </script>
</body>
</html>
